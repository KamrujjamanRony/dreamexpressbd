    <app-root>
      <!-- Lightweight loader (auto-removed when Angular bootstraps) -->
      <style>
        .app-loader {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: var(--color-neutral-50, #f9fafb);
        }
        @media (prefers-color-scheme: dark) {
          .app-loader {
            background: var(--color-dark-surface, #171717);
          }
        }
        .app-loader img {
          width: 72px;
          height: 72px;
          object-fit: contain;
          border-radius: 14px;
          animation: pulse 1.8s ease-in-out infinite;
        }
        .app-loader .bar {
          width: 160px;
          height: 3px;
          background: var(--color-neutral-200, #e5e7eb);
          border-radius: 3px;
          overflow: hidden;
          margin-top: 24px;
        }
        .app-loader .bar i {
          display: block;
          height: 100%;
          width: 40%;
          border-radius: 3px;
          background: var(--color-primary-600, #2563eb);
          animation: slide 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 0.9;
          }
          50% {
            transform: scale(1.06);
            opacity: 1;
          }
        }
        @keyframes slide {
          0% {
            transform: translateX(-100%);
          }
          50% {
            transform: translateX(250%);
          }
          100% {
            transform: translateX(400%);
          }
        }
      </style>

        <div class="bar"><i></i></div>
