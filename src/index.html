<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dream Express BD - Quality Products Online in Bangladesh</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Dream Express BD - Your trusted online shop for quality products in Bangladesh. Fast delivery, secure payment, and great deals."
    />
    <meta name="keywords" content="Dream Express BD, online shop, Bangladesh, delivery, products" />
    <meta name="author" content="Dream Express BD" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="http://localhost:4200/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dream Express BD" />
    <meta property="og:title" content="Dream Express BD - Quality Products Online" />
    <meta
      property="og:description"
      content="Your trusted online shop for quality products in Bangladesh. Fast delivery, secure payment, and great deals."
    />
    <meta property="og:image" content="http://localhost:4200/logo.webp" />
    <meta property="og:url" content="http://localhost:4200/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dream Express BD - Quality Products Online" />
    <meta
      name="twitter:description"
      content="Your trusted online shop for quality products in Bangladesh."
    />
    <meta name="twitter:image" content="http://localhost:4200/logo.webp" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — non-blocking preload -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- Font Awesome — non-blocking preload -->
    <link
      rel="preload"
      as="style"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      media="print"
      onload="this.media = 'all'"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Dream Express BD",
        "url": "http://localhost:4200",
        "logo": "http://localhost:4200/logo.webp",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+8801818545586",
          "contactType": "customer service",
          "availableLanguage": ["Bengali", "English"]
        },
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <app-root>
      <!-- Lightweight loader (auto-removed when Angular bootstraps) -->
      <style>
        .app-loader {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: var(--color-neutral-50, #f9fafb);
        }
        @media (prefers-color-scheme: dark) {
          .app-loader {
            background: var(--color-dark-surface, #171717);
          }
        }
        .app-loader img {
          width: 72px;
          height: 72px;
          object-fit: contain;
          border-radius: 14px;
          animation: pulse 1.8s ease-in-out infinite;
        }
        .app-loader .bar {
          width: 160px;
          height: 3px;
          background: var(--color-neutral-200, #e5e7eb);
          border-radius: 3px;
          overflow: hidden;
          margin-top: 24px;
        }
        .app-loader .bar i {
          display: block;
          height: 100%;
          width: 40%;
          border-radius: 3px;
          background: var(--color-primary-600, #2563eb);
          animation: slide 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 0.9;
          }
          50% {
            transform: scale(1.06);
            opacity: 1;
          }
        }
        @keyframes slide {
          0% {
            transform: translateX(-100%);
          }
          50% {
            transform: translateX(250%);
          }
          100% {
            transform: translateX(400%);
          }
        }
      </style>
      <div class="app-loader">
        <img src="logo.webp" alt="Dream Express BD" width="72" height="72" />
        <div class="bar"><i></i></div>
      </div>
    </app-root>
  </body>
</html>
