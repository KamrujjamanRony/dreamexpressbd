<!-- Floating widget tray -->
<div
  class="widget-tray fixed bottom-20 right-4 lg:bottom-6 lg:right-6 z-50 flex flex-col items-center gap-[0.65rem]"
  [class.widget-tray--hidden]="!isVisible"
>
  <!-- Theme toggle FAB (always on top) -->
  <button
    class="w-12 h-12 rounded-full border-none text-white cursor-pointer flex items-center justify-center relative transition-all duration-300 bg-[linear-gradient(135deg,#f59e0b,#f97316)] shadow-[0_4px_14px_rgba(245,158,11,0.4)] hover:shadow-[0_6px_20px_rgba(245,158,11,0.5)] hover:scale-[1.08]"
    (click)="toggleTheme()"
    aria-label="Toggle theme"
  >
    <!-- Sun icon (light mode) -->
    <svg
      class="fab__icon"
      [class.fab__icon--hidden]="isDarkMode"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <!-- Moon icon (dark mode) -->
    <svg
      class="fab__icon"
      [class.fab__icon--hidden]="!isDarkMode"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
    </svg>
  </button>

  <!-- Chat buttons (expand between theme and chat FAB) -->
  <div
    class="social-chat-buttons flex flex-col items-center gap-[0.65rem]"
    [class.social-chat-buttons--open]="isOpen"
  >
    @if (whatsappLink) {
      <a
        [href]="whatsappLink"
        target="_blank"
        rel="noopener noreferrer"
        class="social-btn w-[2.8rem] h-[2.8rem] rounded-full flex items-center justify-center text-white no-underline shadow-[0_3px_10px_rgba(0,0,0,0.2)] hover:shadow-[0_5px_16px_rgba(0,0,0,0.25)] bg-[#25d366] hover:bg-[#1ebe5d]"
        aria-label="Chat on WhatsApp"
        [style.transition-delay]="isOpen ? '0.08s' : '0s'"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
          />
        </svg>
      </a>
    }
    @if (messengerLink) {
      <a
        [href]="messengerLink"
        target="_blank"
        rel="noopener noreferrer"
        class="social-btn w-[2.8rem] h-[2.8rem] rounded-full flex items-center justify-center text-white no-underline shadow-[0_3px_10px_rgba(0,0,0,0.2)] hover:shadow-[0_5px_16px_rgba(0,0,0,0.25)] bg-[linear-gradient(135deg,#00c6ff,#0078ff,#a259ff)] hover:bg-[linear-gradient(135deg,#00b8f0,#006ae0,#9040f0)]"
        aria-label="Chat on Messenger"
        [style.transition-delay]="isOpen ? '0.16s' : '0s'"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 2C6.36 2 2 6.13 2 11.7c0 2.91 1.2 5.42 3.15 7.2.16.15.26.36.27.58l.05 1.81c.02.56.6.93 1.11.7l2.02-.8c.17-.07.36-.09.54-.05.89.24 1.84.37 2.86.37 5.64 0 10-4.13 10-9.7C22 6.13 17.64 2 12 2zm5.89 7.6l-2.88 4.57c-.46.73-1.44.92-2.13.42l-2.29-1.72a.56.56 0 00-.67 0l-3.09 2.34c-.41.31-.95-.19-.67-.63l2.88-4.57c.46-.73 1.44-.92 2.13-.42l2.29 1.72a.56.56 0 00.67 0l3.09-2.34c.41-.31.95.19.67.63z"
          />
        </svg>
      </a>
    }
  </div>

  <!-- Chat toggle FAB + hide button -->
  <div class="relative">
    <button
      class="w-12 h-12 rounded-full border-none text-white cursor-pointer flex items-center justify-center relative transition-all duration-300 hover:scale-[1.08]"
      [class]="
        isOpen
          ? 'bg-[linear-gradient(135deg,#ef4444,#f97316)] shadow-[0_4px_14px_rgba(239,68,68,0.4)]'
          : 'bg-[linear-gradient(135deg,var(--color-primary-600),var(--color-primary-500))] shadow-[0_4px_14px_color-mix(in_srgb,var(--color-primary-600)_40%,transparent)] hover:shadow-[0_6px_20px_color-mix(in_srgb,var(--color-primary-600)_50%,transparent)]'
      "
      (click)="toggleChat()"
      aria-label="Toggle chat options"
    >
      <svg
        class="fab__icon"
        [class.fab__icon--hidden]="isOpen"
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
      </svg>
      <svg
        class="fab__icon"
        [class.fab__icon--hidden]="!isOpen"
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>

    <!-- Hide all button -->
    <button
      class="absolute -bottom-[0.2rem] -right-[0.2rem] w-[1.1rem] h-[1.1rem] rounded-full border-none bg-neutral-500 text-white cursor-pointer flex items-center justify-center shadow-[0_1px_4px_rgba(0,0,0,0.2)] transition-all duration-200 hover:bg-red-500 hover:scale-[1.15] z-10"
      (click)="hide()"
      aria-label="Hide widgets"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="10"
        height="10"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>

<!-- Single reopen arrow button -->
<button
  class="reopen-arrow fixed bottom-6 right-0 z-[49] w-[1.75rem] h-10 rounded-l-lg border-none bg-neutral-500/20 backdrop-blur-sm text-neutral-500 cursor-pointer flex items-center justify-center shadow-[-2px_0_8px_rgba(0,0,0,0.1)] hover:bg-neutral-500/35"
  [class.reopen-arrow--visible]="!isVisible"
  (click)="show()"
  aria-label="Show widgets"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="15 18 9 12 15 6"></polyline>
  </svg>
</button>
