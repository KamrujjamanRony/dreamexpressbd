<!-- feature -->
<div class="py-6">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Free Shipping -->
    <div
      class="flex items-center gap-4 px-5 py-5 bg-primary-50 dark:bg-primary-900/20 rounded-xl border border-primary-100 dark:border-primary-800/30 transition-all duration-300 hover:shadow-md hover:-translate-y-0.5"
    >
      <div
        class="flex-shrink-0 w-12 h-12 flex items-center justify-center bg-primary-100 dark:bg-primary-800/40 rounded-full"
      >
        <img
          ngSrc="images/icons/delivery-van.svg"
          width="28"
          height="28"
          loading="lazy"
          decoding="async"
          class="w-7 h-7 object-contain"
          alt="Free Shipping"
        />
      </div>
      <div>
        <h4 class="font-semibold text-gray-900 dark:text-gray-50 text-sm md:text-base">
          Free Shipping
        </h4>
        <p class="text-gray-500 dark:text-gray-400 text-xs md:text-sm">
          Order over <span [innerHTML]="2000 | bdt"></span>
        </p>
      </div>
    </div>
    <!-- Money Returns -->
    <div
      class="flex items-center gap-4 px-5 py-5 bg-green-50 dark:bg-green-900/20 rounded-xl border border-green-100 dark:border-green-800/30 transition-all duration-300 hover:shadow-md hover:-translate-y-0.5"
    >
      <div
        class="flex-shrink-0 w-12 h-12 flex items-center justify-center bg-green-100 dark:bg-green-800/40 rounded-full"
      >
        <img
          ngSrc="images/icons/money-back.svg"
          width="28"
          height="28"
          loading="lazy"
          decoding="async"
          class="w-7 h-7 object-contain"
          alt="Money Returns"
        />
      </div>
      <div>
        <h4 class="font-semibold text-gray-900 dark:text-gray-50 text-sm md:text-base">
          Money Returns
        </h4>
        <p class="text-gray-500 dark:text-gray-400 text-xs md:text-sm">30 days money return</p>
      </div>
    </div>
    <!-- 24/7 Support -->
    <div
      class="flex items-center gap-4 px-5 py-5 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800/30 transition-all duration-300 hover:shadow-md hover:-translate-y-0.5"
    >
      <div
        class="flex-shrink-0 w-12 h-12 flex items-center justify-center bg-blue-100 dark:bg-blue-800/40 rounded-full"
      >
        <img
          ngSrc="images/icons/service-hours.svg"
          width="28"
          height="28"
          loading="lazy"
          decoding="async"
          class="w-7 h-7 object-contain"
          alt="24/7 Support"
        />
      </div>
      <div>
        <h4 class="font-semibold text-gray-900 dark:text-gray-50 text-sm md:text-base">
          24/7 Support
        </h4>
        <p class="text-gray-500 dark:text-gray-400 text-xs md:text-sm">Customer support</p>
      </div>
    </div>
  </div>
</div>
<!-- feature end -->
