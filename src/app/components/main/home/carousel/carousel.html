<div class="relative overflow-hidden rounded-2xl shadow-xl">
  <!-- navigation="true" -->
  <swiper-container
    slides-per-view="1"
    loop="true"
    autoplay-delay="4000"
    autoplay-disable-on-interaction="false"
    effect="fade"
    fade-cross-fade="true"
    speed="800"
    pagination="true"
    pagination-clickable="true"
  >
    @for (item of carousels(); track item.id) {
      <swiper-slide>
        <div class="relative w-full min-h-75 md:min-h-110 lg:min-h-130 overflow-hidden">
          <!-- Background Image with Ken Burns -->
          <div
            class="absolute inset-0 bg-cover bg-center carousel-bg"
            [style.backgroundImage]="'url(' + imageApi + item.imageUrl + ')'"
          ></div>
          <!-- Bottom gradient for text readability -->
          <div
            class="absolute inset-x-0 bottom-0 h-3/4 bg-gradient-to-t from-black/60 via-black/25 to-transparent pointer-events-none"
          ></div>
          <!-- Content -->
          @if (item.title || item.description) {
            <div
              class="relative z-10 flex items-end h-full min-h-75 md:min-h-110 lg:min-h-130 px-8 md:px-14 lg:px-20 pb-14 md:pb-16 lg:pb-20"
            >
              <div class="max-w-xl">
                <h2
                  class="carousel-title text-2xl md:text-4xl lg:text-5xl font-extrabold text-white leading-tight drop-shadow-lg"
                >
                  {{ item.title }}
                </h2>
                @if (item.description) {
                  <p
                    class="carousel-desc text-sm md:text-base lg:text-lg text-white/85 leading-relaxed mt-3 md:mt-5 drop-shadow-md"
                  >
                    {{ item.description }}
                  </p>
                }
                <a
                  routerLink="/shop"
                  class="carousel-btn group inline-flex items-center gap-2 mt-5 md:mt-8 px-8 py-3.5 bg-primary-600 text-white font-bold rounded-full shadow-xl shadow-primary-500/30 hover:bg-primary-700 transition-all duration-400 hover:shadow-2xl hover:-translate-y-0.5 hover:gap-3 text-sm md:text-base"
                >
                  Shop Now
                  <svg
                    class="w-4 h-4 transition-transform duration-300 group-hover:translate-x-1"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 8l4 4m0 0l-4 4m4-4H3"
                    />
                  </svg>
                </a>
              </div>
            </div>
          }
        </div>
      </swiper-slide>
    }
  </swiper-container>
</div>
