<div class="relative overflow-hidden rounded-2xl shadow-xl">
  <swiper-container
    slides-per-view="1"
    loop="true"
    navigation="true"
    autoplay-delay="4000"
    autoplay-disable-on-interaction="false"
    effect="fade"
    fade-cross-fade="true"
    speed="800"
    pagination="true"
    pagination-clickable="true"
  >
    @for (item of carousels(); track item.id) {
      <swiper-slide>
        <div
          class="relative w-full min-h-[300px] md:min-h-[440px] lg:min-h-[520px] overflow-hidden"
        >
          <!-- Background Image with Ken Burns -->
          <div
            class="absolute inset-0 bg-cover bg-center carousel-bg"
            [style.backgroundImage]="'url(' + item.image + ')'"
          ></div>
          <!-- Gradient Overlay -->
          <div
            class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/35 to-transparent"
          ></div>
          <!-- Content -->
          @if (item.title || item.description) {
            <div
              class="relative z-10 flex items-center h-full min-h-[300px] md:min-h-[440px] lg:min-h-[520px] px-8 md:px-14 lg:px-20"
            >
              <div class="max-w-xl">
                <h2
                  class="carousel-title text-2xl md:text-4xl lg:text-5xl font-bold text-white leading-tight drop-shadow-lg"
                >
                  {{ item.title }}
                </h2>
                <p
                  class="carousel-desc text-sm md:text-base lg:text-lg text-gray-200 leading-relaxed mt-3 md:mt-5 drop-shadow"
                >
                  {{ item.description }}
                </p>
                <a
                  routerLink="/shop"
                  class="carousel-btn inline-flex items-center gap-2 mt-5 md:mt-8 px-8 py-3.5 bg-white text-gray-900 font-semibold rounded-full shadow-lg hover:bg-purple-600 hover:text-white transition-all duration-300 hover:shadow-xl hover:-translate-y-0.5 text-sm md:text-base"
                >
                  Shop Now
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M17 8l4 4m0 0l-4 4m4-4H3"
                    />
                  </svg>
                </a>
              </div>
            </div>
          }
        </div>
      </swiper-slide>
    }
  </swiper-container>
</div>
