@if (product()) {
  <section class="max-w-7xl mx-auto px-4 py-6">
    <app-breadcrumbs name="view" />
    <app-view-image [product]="product()" />
    <app-view-content [product]="product()" />
    <!-- Related products -->
    <app-related-product [currentProduct]="product()" [allProducts]="allProducts()">
    </app-related-product>
  </section>
} @else {
  <section class="max-w-7xl mx-auto w-full px-4 py-6">
    <!-- Skeleton -->
    <div class="animate-pulse grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Image skeleton -->
      <div>
        <div class="aspect-square bg-gray-200 dark:bg-gray-700 rounded-xl w-full"></div>
        <div class="flex gap-2.5 mt-4">
          @for (_ of [1, 2, 3, 4]; track _) {
            <div class="w-20 h-20 bg-gray-200 dark:bg-gray-700 rounded-lg shrink-0"></div>
          }
        </div>
      </div>
      <!-- Details skeleton -->
      <div class="space-y-4 pt-2">
        <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded-lg w-3/4"></div>
        <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2"></div>
        <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/3"></div>
        <div class="h-12 bg-gray-200 dark:bg-gray-700 rounded-lg w-1/3 mt-4"></div>
        <div class="border-t border-gray-200 dark:border-gray-700 my-4"></div>
        <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-20"></div>
        <div class="flex gap-3">
          @for (_ of [1, 2, 3]; track _) {
            <div class="w-16 h-16 bg-gray-200 dark:bg-gray-700 rounded-lg shrink-0"></div>
          }
        </div>
        <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-16 mt-4"></div>
        <div class="flex gap-2">
          @for (_ of [1, 2, 3]; track _) {
            <div class="w-11 h-11 bg-gray-200 dark:bg-gray-700 rounded-lg shrink-0"></div>
          }
        </div>
        <div class="flex gap-3 mt-6">
          <div class="flex-1 h-14 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
          <div class="w-32 h-14 bg-gray-200 dark:bg-gray-700 rounded-xl"></div>
        </div>
      </div>
    </div>
    <!-- Related skeleton -->
    <div class="animate-pulse grid grid-cols-2 lg:grid-cols-4 gap-4 mt-12">
      @for (_ of [1, 2, 3, 4]; track _) {
        <app-product-skeleton></app-product-skeleton>
      }
    </div>
  </section>
}
