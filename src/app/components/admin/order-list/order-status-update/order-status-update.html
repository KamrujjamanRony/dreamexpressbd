<div>
  @if (showModal) {
    <div id="modal">
      <div
        class="fixed inset-0 p-4 flex flex-wrap justify-center items-center w-full h-full z-1000 before:fixed before:inset-0 before:w-full before:h-full before:bg-[rgba(0,0,0,0.8)] overflow-auto"
      >
        <div class="w-full max-w-md bg-white shadow-lg rounded-xl p-6 relative dark:bg-neutral-800">
          <button (click)="closeModal()" class="absolute top-4 right-4">
            <svg
              id="closeIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="w-3.5 h-3.5 cursor-pointer shrink-0 fill-neutral-400 hover:fill-red-500 float-right"
              viewBox="0 0 320.591 320.591"
            >
              <path
                d="M30.391 318.583a30.37 30.37 0 0 1-21.56-7.288c-11.774-11.844-11.774-30.973 0-42.817L266.643 10.665c12.246-11.459 31.462-10.822 42.921 1.424 10.362 11.074 10.966 28.095 1.414 39.875L51.647 311.295a30.366 30.366 0 0 1-21.256 7.288z"
                data-original="#000000"
              ></path>
              <path
                d="M287.9 318.583a30.37 30.37 0 0 1-21.257-8.806L8.83 51.963C-2.078 39.225-.595 20.055 12.143 9.146c11.369-9.736 28.136-9.736 39.504 0l259.331 257.813c12.243 11.462 12.876 30.679 1.414 42.922-.456.487-.927.958-1.414 1.414a30.368 30.368 0 0 1-23.078 7.288z"
                data-original="#000000"
              ></path>
            </svg>
          </button>

          <div class="">
            <div class="text-center">
              <div>
                <h3 class="text-lg leading-6 font-medium text-neutral-900 dark:text-white mb-4">
                  Update Order Status
                </h3>

                <div class="mb-4">
                  <label
                    class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1"
                  >
                    Current Status
                  </label>
                  <div
                    class="mt-1 px-3 py-2 bg-neutral-100 dark:bg-neutral-800 rounded-md text-neutral-900 dark:text-white border border-neutral-300 dark:border-neutral-600"
                  >
                    {{ currentStatus }}
                  </div>
                </div>

                <div class="mb-4">
                  <label
                    class="block text-sm font-medium text-neutral-700 dark:text-neutral-300 mb-1"
                  >
                    New Status
                  </label>
                  <select
                    autocomplete="off"
                    [(ngModel)]="newStatus"
                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border border-neutral-600 dark:border-neutral-300 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm rounded-md bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white"
                  >
                    @for (option of statusOptions; track option.value) {
                      <option [value]="option.value" [selected]="option.value === currentStatus">
                        {{ option.label }}
                      </option>
                    }
                  </select>
                </div>

                @if (newStatus() === 'Delivered') {
                  <div class="mb-4 p-3 bg-blue-50 dark:bg-blue-900/20 rounded-md">
                    <div class="text-sm text-blue-700 dark:text-blue-300">
                      <svg
                        class="inline h-5 w-5 mr-1"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                      >
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                        ></path>
                      </svg>
                      Delivery date will be set to current time automatically
                    </div>
                  </div>
                }
              </div>

              <div class="mt-5 sm:mt-6 sm:grid sm:grid-cols-2 sm:gap-3 sm:grid-flow-row-dense">
                <button
                  (click)="updateStatus()"
                  type="button"
                  class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-primary-600 text-base font-medium text-white hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 sm:col-start-2 sm:text-sm"
                >
                  Update Status
                </button>
                <button
                  (click)="closeModal()"
                  type="button"
                  class="mt-3 w-full inline-flex justify-center rounded-md border border-neutral-300 dark:border-neutral-600 shadow-sm px-4 py-2 bg-white dark:bg-neutral-800 text-base font-medium text-neutral-700 dark:text-neutral-300 hover:bg-neutral-50 dark:hover:bg-neutral-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 sm:mt-0 sm:col-start-1 sm:text-sm"
                >
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  }

  <span
    class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full cursor-pointer"
    [class]="getStatusColor(currentStatus)"
    (click)="openModal()"
    title="Click to update status"
  >
    {{ currentStatus }}
  </span>
</div>
