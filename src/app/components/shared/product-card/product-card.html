<div
  class="group h-full flex flex-col bg-white dark:bg-neutral-900 border border-black/6 dark:border-primary-500/8 dark:shadow-[0_1px_3px_rgba(0,0,0,0.2)] rounded-xl overflow-hidden shadow-sm hover:shadow-xl dark:hover:shadow-[0_8px_24px_rgba(0,0,0,0.3)] dark:hover:border-primary-500/20 transition-all duration-300 hover:-translate-y-1 relative"
>
  <a [routerLink]="getViewLink(product()?.id)" class="block relative">
    <!-- Discount Badge -->
    @if (product()?.discount > 0) {
      <span
        class="absolute top-3 left-3 z-10 bg-red-500 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-md"
      >
        -{{ product()?.discount }}%
      </span>
    }
    <!-- Product Image -->
    <div class="overflow-hidden bg-neutral-50 dark:bg-neutral-700">
      @if (isPriority()) {
        <img
          [ngSrc]="imageBaseUrl + product()?.resolvedImageUrl"
          [alt]="product()?.title"
          width="300"
          height="300"
          priority
          class="w-full aspect-square object-cover object-top transition-transform duration-500 group-hover:scale-110"
        />
      } @else {
        <img
          [ngSrc]="imageBaseUrl + product()?.resolvedImageUrl"
          [alt]="product()?.title"
          width="300"
          height="300"
          loading="lazy"
          class="w-full aspect-square object-cover object-top transition-transform duration-500 group-hover:scale-110"
        />
      }
    </div>
  </a>

  <!-- Product Info -->
  <div class="flex flex-col flex-1 p-3 md:p-4">
    <a [routerLink]="getViewLink(product()?.id)" class="block">
      <h6
        class="text-sm md:text-base font-semibold text-neutral-800 dark:text-neutral-100 line-clamp-2 leading-snug hover:text-primary-600 transition-colors"
      >
        {{ product()?.title }}
      </h6>
    </a>

    <!-- Price -->
    <div class="mt-2 md:mt-3 flex items-baseline gap-2 flex-wrap">
      <span
        class="text-base md:text-lg font-bold text-primary-600"
        [innerHTML]="product()?.offerPrice | bdt"
      ></span>
      @if (product()?.regularPrice > product()?.offerPrice) {
        <span
          class="text-xs md:text-sm text-neutral-400 line-through"
          [innerHTML]="product()?.regularPrice | bdt"
        ></span>
      }
    </div>

    <!-- Spacer -->
    <div class="flex-1 min-h-2"></div>

    <!-- Actions -->
    <div class="mt-3 flex flex-col gap-1.5">
      <button
        type="button"
        (click)="addToCart(product)"
        class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium transition-all duration-200 cursor-pointer shadow-sm hover:shadow-md"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
          />
        </svg>
        Add to Cart
      </button>
      <button
        type="button"
        (click)="buyNow(product)"
        class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg border border-primary-500 text-primary-600 dark:text-primary-400 text-sm font-semibold transition-all duration-200 cursor-pointer bg-white dark:bg-neutral-900 hover:bg-primary-50 dark:hover:bg-primary-900/20"
      >
        Buy Now
      </button>
    </div>
  </div>
</div>
