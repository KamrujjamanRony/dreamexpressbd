<section class="bg-gray-50 text-gray-950 dark:bg-[#0b0f19] dark:text-gray-100 relative">
  @if (routeLoading()) {
    <div class="route-overlay">
      <!-- Top progress bar -->
      <div class="route-topbar">
        <div class="route-topbar-fill"></div>
      </div>
      <!-- Center spinner -->
      <div class="route-center">
        <div class="route-ring route-ring-1"></div>
        <div class="route-ring route-ring-2"></div>
        <div class="route-ring route-ring-3"></div>
        <div class="route-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  }
  <app-social-chat></app-social-chat>
  <router-outlet></router-outlet>
  <app-toast></app-toast>
  <app-confirm></app-confirm>
</section>
